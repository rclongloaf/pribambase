[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["aseprite"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "F401", # Blender modules intentionally re-export registration classes.
    "F403", # Existing add-on registration relies on star imports.
    "F405", # Names exported by the registration modules are used in __init__.
    "E402", # Dependency bootstrap must run before importing Blender modules.
    "E722", # Legacy Blender-version compatibility paths intentionally catch all errors.
]
